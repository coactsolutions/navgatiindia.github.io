<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - NAVGATI</title>

<link rel="stylesheet" href="style.css">

<style>

/* ================================
   PAGE BASE
================================ */
body{
  margin:0;
  font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
}

/* Push content below navbar */
.page-wrapper{
  margin-top:110px;
  max-width:1400px;
  margin-left:auto;
  margin-right:auto;
  padding:20px;
}

h1{
  text-align:center;
  color:white;
  font-size:3rem;
  margin-bottom:50px;
}

/* ================================
   CATEGORY CARDS
================================ */
.category-selection{
  display:flex;
  justify-content:center;
  gap:40px;
  flex-wrap:wrap;
}

.category-card{
  background:rgba(255,255,255,0.15);
  padding:60px 80px;
  border-radius:20px;
  cursor:pointer;
  transition:.4s;
  text-align:center;
  color:white;
}

.category-card:hover{
  transform:translateY(-10px) scale(1.05);
  background:rgba(255,255,255,0.25);
}

.category-card .icon{
  font-size:4rem;
  margin-bottom:20px;
}

.category-card h2{
  font-size:2rem;
}

/* ================================
   GALLERY SECTIONS
================================ */
.gallery-section{ display:none; }
.gallery-section.active{ display:block; }

/* ===== GLASS HEADER BAR ===== */
.section-header{
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(6px);
  border-radius: 18px;
  padding: 25px 40px;
  margin: 40px auto;
  width: 95%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow: inset 0 0 0 rgba(0,0,0,0);  /* NO white effect */
}

/* Title */
.section-title{
  color:#c9aff8;
  font-size:2rem;
  font-weight:600;
}

/* Pink Button */
.back-btn{
  background: linear-gradient(135deg,#ff7ad9,#ff4f81);
  color:rgb(157, 138, 241);
  border:none;
  padding:10px 25px;
  border-radius:25px;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
  transition:.3s;
}

.back-btn:hover{
  transform:scale(1.05);
  background: linear-gradient(135deg,#ff4f81,#ff7ad9);
}

/* ================================
   GALLERY GRID
================================ */
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

.gallery-item{
  position:relative;
  overflow:hidden;
  border-radius:15px;
  cursor:pointer;
}

.gallery-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.3s;
}

.gallery-item:hover img{
  transform:scale(1.1);
}

.overlay{
  position:absolute;
  bottom:0;
  width:100%;
  background:rgba(0,0,0,0.7);
  color:rgb(197, 170, 240);
  padding:10px;
  text-align:center;
  font-size:14px;
}

/* ================================
   LOAD MORE
================================ */
.load-more-btn{
  margin:40px auto;
  display:block;
  background:#ff3b2f;
  color:rgb(198, 166, 240);
  border:none;
  padding:15px 40px;
  border-radius:30px;
  cursor:pointer;
}

.load-more-btn:hover{
  background:#d92c22;
}

.hidden{ display:none; }

/* ================================
   LIGHTBOX
================================ */
/* ================================
   LIGHTBOX
================================ */
.lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
  flex-direction:column;
}

.lightbox.active{ display:flex; }

.lightbox img{
  max-width:90%;
  max-height:80%;
  margin-top:60px;   /* ← moves image downward */
}

/* Top Buttons */
.lightbox-controls{
  position:absolute;
  top:20px;
  right:20px;
  display:flex;
  gap:15px;
}

.lightbox-btn{
  background:#ff4f81;
  color:white;
  border:none;
  padding:8px 18px;
  border-radius:20px;
  cursor:pointer;
}

.lightbox-btn:hover{
  background:#ff2f6d;
}

/* Arrows */
.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:50px;
  color:white;
  cursor:pointer;
  padding:10px;
}

.arrow.left{ left:20px; }
.arrow.right{ right:20px; }

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="container">
    <div class="nav-container">

      <div class="logo">
        <img src="logo.bmp" alt="NAVGATI LOGO">
      </div>

      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>

        <li class="dropdown">
          <a href="#">Services ▾</a>
          <ul class="dropdown-menu">
            <li><a href="engineering.html">Engineering Services</a></li>
            <li><a href="software.html">Software Services</a></li>
          </ul>
        </li>

        <li><a href="gallery.html" class="active">Gallery</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>

      <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </div>

    </div>
  </div>
</nav>

<!-- CONTENT -->
<div class="page-wrapper">

<h1>Our Gallery</h1>

<!-- CATEGORY -->
<div class="category-selection" id="category-selection">

  <div class="category-card" onclick="showGallery('projects')">
    <div class="icon">🏗️</div>
    <h2>Our Projects</h2>
  </div>

  <div class="category-card" onclick="showGallery('navgati')">
    <div class="icon">🏢</div>
    <h2>NAVGATI Pvt Ltd</h2>
  </div>

</div>

<!-- PROJECTS -->
<div class="gallery-section" id="projects-section">

  <div class="section-header">
    <h2 class="section-title">Our Projects</h2>
    <button class="back-btn" onclick="showCategories()">← Back to Categories</button>
  </div>

  <div class="gallery-grid" id="projects-gallery"></div>
  <button class="load-more-btn" id="load-more-projects">Load More</button>

</div>

<!-- NAVGATI -->
<div class="gallery-section" id="navgati-section">

  <div class="section-header">
    <h2 class="section-title">NAVGATI Pvt Ltd</h2>
    <button class="back-btn" onclick="showCategories()">← Back to Categories</button>
  </div>

  <div class="gallery-grid" id="navgati-gallery"></div>
  <button class="load-more-btn" id="load-more-navgati">Load More</button>

</div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">

  <div class="lightbox-controls">
    <button class="lightbox-btn" onclick="closeLightbox()">Home</button>
    <button class="lightbox-btn" onclick="closeLightbox()">Close</button>
  </div>

  <span class="arrow left" onclick="prevImage()">&#10094;</span>

  <img id="lightbox-img">

  <span class="arrow right" onclick="nextImage()">&#10095;</span>

</div>

<script>

/* MOBILE NAV */
const hamburger=document.getElementById("hamburger");
const navMenu=document.getElementById("navMenu");
hamburger.onclick=()=>navMenu.classList.toggle("active");

/* IMAGES */

const projectImages = [
  { src: "projects/project1.jpg", title: "Project 1" },
  { src: "projects/project2.jpg", title: "Project 2" },
  { src: "projects/project3.jpg", title: "Project 3" },
  { src: "projects/project4.jpg", title: "Project 4" },
  { src: "projects/project5.jpg", title: "Project 5" }
];

const navgatiImages = [
  { src: "navgati/navgati1.jpg", title: "navgati1" },
  { src: "navgati/navgati2.jpg", title: "navgati2" },
  { src: "navgati/navgati3.jpg", title: "navgati3" },
  { src: "navgati/navgati4.jpg", title: "navgati4" },
  { src: "navgati/navgati5.jpg", title: "navgati5" },
  { src: "navgati/navgati6.jpg", title: "navgati6" },
  { src: "navgati/navgati7.jpg", title: "navgati7" }
];

let projectsLoaded=9;
let navgatiLoaded=9;

let currentImages=[];
let currentIndex=0;

/* CATEGORY */

function showCategories(){
  document.getElementById("category-selection").style.display="flex";
  document.getElementById("projects-section").classList.remove("active");
  document.getElementById("navgati-section").classList.remove("active");
}

function showGallery(type){
  document.getElementById("category-selection").style.display="none";

  if(type==="projects"){
    document.getElementById("projects-section").classList.add("active");
    loadImages(projectImages,"projects-gallery",projectsLoaded);
    currentImages=projectImages;
  }

  if(type==="navgati"){
    document.getElementById("navgati-section").classList.add("active");
    loadImages(navgatiImages,"navgati-gallery",navgatiLoaded);
    currentImages=navgatiImages;
  }
}

/* LOAD IMAGES */

function loadImages(arr,id,count){
  const g=document.getElementById(id);
  g.innerHTML=arr.slice(0,count).map((img,i)=>`
    <div class="gallery-item" onclick="openLightbox(${i})">
      <img src="${img.src}">
      <div class="overlay">${img.title}</div>
    </div>
  `).join("");
}

document.getElementById("load-more-projects").onclick=()=>{
  projectsLoaded+=6;
  loadImages(projectImages,"projects-gallery",projectsLoaded);
};

document.getElementById("load-more-navgati").onclick=()=>{
  navgatiLoaded+=6;
  loadImages(navgatiImages,"navgati-gallery",navgatiLoaded);
};

/* LIGHTBOX */

function openLightbox(index){
  currentIndex=index;
  document.getElementById("lightbox").classList.add("active");
  document.getElementById("lightbox-img").src=currentImages[index].src;
}

function closeLightbox(){
  document.getElementById("lightbox").classList.remove("active");
}

function nextImage(){
  currentIndex=(currentIndex+1)%currentImages.length;
  document.getElementById("lightbox-img").src=currentImages[currentIndex].src;
}

function prevImage(){
  currentIndex=(currentIndex-1+currentImages.length)%currentImages.length;
  document.getElementById("lightbox-img").src=currentImages[currentIndex].src;
}

/* KEYBOARD SUPPORT */
document.addEventListener("keydown",function(e){
  if(!document.getElementById("lightbox").classList.contains("active")) return;

  if(e.key==="ArrowRight") nextImage();
  if(e.key==="ArrowLeft") prevImage();
  if(e.key==="Escape") closeLightbox();
});

</script>

</body>
</html>
