<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Our Work | NAVGATI</title>
    <style>
        /* Reset and general styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }

        /* NAVIGATION BAR */
        .navbar { width: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); position: fixed; top: 0; left: 0; z-index: 999; }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; max-width: 1400px; margin: auto; }
        .navbar .logo img { height: 50px; }
        .navbar ul { list-style: none; display: flex; gap: 25px; }
        .navbar ul li { position: relative; }
        .navbar a { color: white; text-decoration: none; font-weight: 500; padding: 5px 0; transition: 0.3s; }
        .navbar a:hover, .navbar a.active { color: #f093fb; }
        .navbar .dropdown-menu { position: absolute; top: 30px; left: 0; display: none; background: rgba(0,0,0,0.8); border-radius: 10px; padding: 10px 0; min-width: 200px; }
        .navbar .dropdown:hover .dropdown-menu { display: block; }
        .navbar .dropdown-menu li { padding: 10px 20px; }
        .navbar .dropdown-menu li a { color: white; }
        .navbar .hamburger { display: none; flex-direction: column; cursor: pointer; gap: 5px; }
        .navbar .hamburger span { width: 25px; height: 3px; background: white; }

        /* Container */
        .container { max-width: 1400px; margin: 120px auto 50px; padding: 0 20px; } /* margin-top adjusted for navbar */

        h1 { text-align: center; color: white; font-size: 3rem; margin-bottom: 50px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        /* Category Selection */
        .category-selection { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-bottom: 50px; }
        .category-card { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 20px; padding: 60px 80px; cursor: pointer; transition: all 0.4s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.2); }
        .category-card:hover { transform: translateY(-10px) scale(1.05); background: rgba(255,255,255,0.25); box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
        .category-card h2 { color: white; font-size: 2rem; text-align: center; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .category-card .icon { font-size: 4rem; text-align: center; margin-bottom: 20px; }

        /* Gallery Section */
        .gallery-section { display: none; }
        .gallery-section.active { display: block; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: rgba(255,255,255,0.1); padding: 20px 30px; border-radius: 15px; backdrop-filter: blur(10px); }
        .section-title { color: white; font-size: 2rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .back-btn { padding: 12px 30px; font-size: 1rem; color: white; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border: none; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .back-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }

        /* Gallery Grid */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .gallery-item { position: relative; overflow: hidden; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease; aspect-ratio: 1; background: rgba(255,255,255,0.1); }
        .gallery-item:hover { transform: translateY(-10px) scale(1.02); box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .gallery-item:hover img { transform: scale(1.1); }
        .gallery-item .overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); padding: 20px; transform: translateY(100%); transition: transform 0.3s ease; }
        .gallery-item:hover .overlay { transform: translateY(0); }
        .overlay-text { color: white; font-size: 0.9rem; }

        /* Load More Button */
        .load-more-btn { display: block; margin: 0 auto; padding: 15px 50px; font-size: 1.1rem; color: white; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border: none; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .load-more-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .hidden { display: none; }

        /* Lightbox */
        .lightbox { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .lightbox.active { display: flex; }
        .lightbox-content { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 10px; }
        .close-lightbox { position: absolute; top: 30px; right: 50px; color: white; font-size: 40px; cursor: pointer; transition: transform 0.3s ease; }
        .close-lightbox:hover { transform: scale(1.2); }

        @media (max-width: 768px) {
            .section-header { flex-direction: column; gap: 15px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
            .navbar ul { flex-direction: column; display: none; }
            .navbar .hamburger { display: flex; }
        }
    </style>
</head>
<body>
    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="index.html"><img src="logo.bmp" alt="NAVGATI LOGO"></a>
            </div>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li class="dropdown">
                    <a href="#">Services ▾</a>
                    <ul class="dropdown-menu">
                        <li><a href="engineering.html">Engineering Services</a></li>
                        <li><a href="software.html">Software Services</a></li>
                    </ul>
                </li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            <div class="hamburger" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Our Gallery</h1>

        <!-- Category Selection -->
        <div class="category-selection" id="category-selection">
            <div class="category-card" onclick="showGallery('projects')">
                <div class="icon">🏗️</div>
                <h2>Our Projects</h2>
            </div>
            <div class="category-card" onclick="showGallery('navgati')">
                <div class="icon">🏢</div>
                <h2>NAVGATI PVT LTD</h2>
            </div>
        </div>

        <!-- Projects Gallery -->
        <div class="gallery-section" id="projects-section">
            <div class="section-header">
                <h2 class="section-title">Our Projects</h2>
                <button class="back-btn" onclick="showCategories()">← Back to Categories</button>
            </div>
            <div class="gallery-grid" id="projects-gallery"></div>
            <button class="load-more-btn" id="load-more-projects">Load More Projects</button>
        </div>

        <!-- NAVGATI Gallery -->
        <div class="gallery-section" id="navgati-section">
            <div class="section-header">
                <h2 class="section-title">NAVGATI PVT LTD</h2>
                <button class="back-btn" onclick="showCategories()">← Back to Categories</button>
            </div>
            <div class="gallery-grid" id="navgati-gallery"></div>
            <button class="load-more-btn" id="load-more-navgati">Load More</button>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="close-lightbox">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <script>
        // Hamburger toggle
        function toggleMenu() {
            const menu = document.querySelector('.navbar ul');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        // Sample images
        const projectImages = Array.from({length: 50}, (_, i) => ({ src: `https://picsum.photos/400/400?random=${i+1}`, title: `Project ${i+1}` }));
        const navgatiImages = Array.from({length: 50}, (_, i) => ({ src: `https://picsum.photos/400/400?random=${i+51}`, title: `NAVGATI ${i+1}` }));

        let projectsLoaded = 9;
        let navgatiLoaded = 9;
        const loadIncrement = 9;

        function showCategories() {
            document.getElementById('category-selection').style.display = 'flex';
            document.getElementById('projects-section').classList.remove('active');
            document.getElementById('navgati-section').classList.remove('active');
        }

        function showGallery(type) {
            document.getElementById('category-selection').style.display = 'none';
            if(type==='projects'){
                document.getElementById('projects-section').classList.add('active');
                loadImages(projectImages,'projects-gallery',projectsLoaded);
            }else if(type==='navgati'){
                document.getElementById('navgati-section').classList.add('active');
                loadImages(navgatiImages,'navgati-gallery',navgatiLoaded);
            }
        }

        function createGalleryItem(image){
            return `<div class="gallery-item" onclick="openLightbox('${image.src}')">
                        <img src="${image.src}" alt="${image.title}" loading="lazy">
                        <div class="overlay"><p class="overlay-text">${image.title}</p></div>
                    </div>`;
        }

        function loadImages(images, galleryId, count){
            const gallery = document.getElementById(galleryId);
            gallery.innerHTML = images.slice(0,count).map(createGalleryItem).join('');
        }

        function loadMore(images, galleryId, currentCount, buttonId){
            const newCount = currentCount + loadIncrement;
            loadImages(images,galleryId,newCount);
            if(newCount>=images.length){
                document.getElementById(buttonId).classList.add('hidden');
            }
            return newCount;
        }

        document.getElementById('load-more-projects').addEventListener('click',()=>{ projectsLoaded=loadMore(projectImages,'projects-gallery',projectsLoaded,'load-more-projects'); });
        document.getElementById('load-more-navgati').addEventListener('click',()=>{ navgatiLoaded=loadMore(navgatiImages,'navgati-gallery',navgatiLoaded,'load-more-navgati'); });

        function openLightbox(src){
            document.getElementById('lightbox').classList.add('active');
            document.getElementById('lightbox-img').src=src;
        }

        document.querySelector('.close-lightbox').addEventListener('click',()=>{ document.getElementById('lightbox').classList.remove('active'); });
        document.getElementById('lightbox').addEventListener('click',function(e){ if(e.target.id==='lightbox'){ this.classList.remove('active'); } });
    </script>
</body>
</html>
